name: SpeechMind isolated Srota provider tests

on:
  push:
    branches:
      - feature/speechmind-product-architecture-v2
  pull_request:
    branches:
      - feature/speechmind-product-architecture-v2

jobs:
  srota-provider:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install provider test dependencies
        run: python -m pip install numpy soundfile
      - name: Run isolated worker and script-detection tests
        run: python -m unittest discover -s tests -p "test_srota_provider.py" -v
