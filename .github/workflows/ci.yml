name: SpeechMind CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn openpyxl
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers openai-whisper
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate BHAAV loader against the official archive
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://zenodo.org/records/3457467/files/Datasets-20190922T151602Z-001.zip?download=1" \
            --output "$RUNNER_TEMP/BHAAV.zip"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from scripts.train_bhaav_text_emotion import LABELS, _split_dataframe, load_bhaav_dataframe

          archive = Path(__import__("os").environ["RUNNER_TEMP"]) / "BHAAV.zip"
          digest = hashlib.md5(archive.read_bytes()).hexdigest()
          expected = "cdcaf1997a422f18ee12d713a17ffdea"
          assert digest == expected, f"BHAAV MD5 mismatch: {digest}"

          frame, source = load_bhaav_dataframe(archive)
          counts = frame["label"].value_counts().to_dict()
          assert len(frame) >= 15000, f"Only {len(frame)} BHAAV rows loaded from {source}"
          assert set(frame["label"]) == set(LABELS), f"Unexpected labels: {counts}"

          train, validation, test, group_split = _split_dataframe(frame)
          for name, split in (("train", train), ("validation", validation), ("test", test)):
              assert set(split["label"]) == set(LABELS), f"{name} split missing labels"

          print(f"Official BHAAV parsed: {len(frame)} unique sentences from {source}")
          print(f"Class counts: {counts}")
          print(
              f"Split sizes: {len(train)} train / {len(validation)} validation / "
              f"{len(test)} test; story-disjoint split: {group_split}"
          )
          PY
